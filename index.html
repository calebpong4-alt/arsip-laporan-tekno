<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator LI (Client-Side Direct)</title>
    <!-- Tailwind CSS & Quill.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <!-- html-docx-js untuk konversi HTML ke Word .docx -->
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200">
        
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <span class="font-bold text-red-600 tracking-widest text-lg">RAHASIA</span>
            <div class="text-right text-xs font-semibold text-gray-600 uppercase">
                Sekolah Tinggi Intelijen Negara<br>Intelijen Teknologi
            </div>
        </div>

        <h1 class="text-xl font-bold text-center mb-6 underline">LAPORAN INFORMASI</h1>

        <form id="reportForm" class="space-y-6">
            
            <div class="bg-gray-50 p-4 rounded-md border grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-1">Kategori (R)</label>
                    <input type="text" id="kategori" value="R" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">No. Laporan</label>
                    <input type="number" id="noLaporan" placeholder="46" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Bulan (Romawi)</label>
                    <select id="bulan" class="w-full border p-2 rounded">
                        <option value="I">I</option><option value="II">II</option>
                        <option value="III" selected>III</option><option value="IV">IV</option>
                        <option value="V">V</option><option value="VI">VI</option>
                        <option value="VII">VII</option><option value="VIII">VIII</option>
                        <option value="IX">IX</option><option value="X">X</option>
                        <option value="XI">XI</option><option value="XII">XII</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Tahun</label>
                    <input type="number" id="tahun" value="2026" class="w-full border p-2 rounded" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div>
                    <label class="block font-semibold mb-1">Kepada:</label>
                    <input type="text" value="Yth. Kepala Prodi Intelijen Teknologi" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Dari (Nama Akun):</label>
                    <input type="text" id="namaAkun" value="Monteverdi Kaleb Pinondang Simarmata" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Tembusan:</label>
                <ol class="list-decimal list-inside text-sm bg-gray-50 p-3 rounded border text-gray-700">
                    <li>Sekretaris Prodi Intelijen Teknologi</li>
                    <li>Staf Prodi Intelijen Teknologi</li>
                </ol>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Hal / Subjek</label>
                    <input type="text" id="hal" placeholder="Masukkan perihal..." class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai Informasi</label>
                    <input type="text" id="nilai" placeholder="A-1" class="w-full border p-2 rounded" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Fakta-Fakta</label>
                <div id="editorFakta" class="h-44 bg-white"></div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Catatan</label>
                <div id="editorCatatan" class="h-36 bg-white"></div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Upload Foto Lampiran:</label>
                <input type="file" id="fotoLampiran" accept="image/*" class="w-full border p-2 rounded text-sm">
                <div id="imagePreview" class="mt-2"></div>
            </div>

            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded shadow transition">
                Download Dokumen (.docx) Langsung
            </button>
        </form>
    </div>

    <script>
        const quillFakta = new Quill('#editorFakta', { theme: 'snow' });
        const quillCatatan = new Quill('#editorCatatan', { theme: 'snow' });

        // Preview foto jika diupload
        let base64Image = "";
        document.getElementById('fotoLampiran').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    base64Image = evt.target.result;
                    document.getElementById('imagePreview').innerHTML = `<img src="${base64Image}" class="max-h-48 rounded border">`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const noLaporan = document.getElementById('noLaporan').value;
            const bulan = document.getElementById('bulan').value;
            const tahun = document.getElementById('tahun').value;
            const hal = document.getElementById('hal').value;
            const nilai = document.getElementById('nilai').value;
            const namaAkun = document.getElementById('namaAkun').value;
            const faktaHtml = quillFakta.root.innerHTML;
            const catatanHtml = quillCatatan.root.innerHTML;

            // Merakit HTML Dokumen Sesuai Format Word Master
            const docContent = `
                <!DOCTYPE html>
                <html>
                <head><meta charset="UTF-8"></head>
                <body style="font-family: Arial, sans-serif; font-size: 11pt;">
                    <table width="100%">
                        <tr>
                            <td style="color: red; font-weight: bold; font-size: 14pt;">RAHASIA</td>
                            <td align="right" style="font-size: 9pt; font-weight: bold;">
                                SEKOLAH TINGGI INTELIJEN NEGARA<br>INTELIJEN TEKNOLOGI
                            </td>
                        </tr>
                    </table>
                    <br><br>
                    <h2 align="center" style="text-decoration: underline;">LAPORAN INFORMASI</h2>
                    <p align="center">Nomor: R / LI – ${noLaporan} / ${bulan} / ${tahun}</p>
                    <br>
                    <table border="0" cellpadding="3">
                        <tr><td><b>Kepada</b></td><td>:</td><td>Yth. Kepala Prodi Intelijen Teknologi</td></tr>
                        <tr><td><b>Dari</b></td><td>:</td><td>${namaAkun}</td></tr>
                        <tr>
                            <td valign="top"><b>Tembusan</b></td><td valign="top">:</td>
                            <td>1. Sekretaris Prodi Intelijen Teknologi<br>2. Staf Prodi Intelijen Teknologi</td>
                        </tr>
                        <tr><td><b>Hal</b></td><td>:</td><td>${hal}</td></tr>
                        <tr><td><b>Nilai</b></td><td>:</td><td>${nilai}</td></tr>
                    </table>
                    <br>
                    <h4 style="margin-bottom: 2px;">FAKTA-FAKTA</h4>
                    <div>${faktaHtml}</div>
                    <br>
                    <h4 style="margin-bottom: 2px;">CATATAN</h4>
                    <div>${catatanHtml}</div>
                    <br>
                    <h4 style="margin-bottom: 2px;">LAMPIRAN</h4>
                    ${base64Image ? `<img src="${base64Image}" width="400" />` : '<p>-</p>'}
                </body>
                </html>
            `;

            // Convert HTML ke .docx file langsung di browser
            const converted = htmlDocx.asBlob(docContent);
            saveAs(converted, `LI-${noLaporan}-${bulan}-${tahun}.docx`);
        });
    </script>
</body>
</html>
