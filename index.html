<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator LI (Client-Side Direct)</title>
    <!-- Tailwind CSS & Quill.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    
    <!-- Library untuk Konversi Word (.docx) -->
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Library untuk Konversi PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200">
        
        <div class="text-center mb-4">
            <span class="font-bold text-black tracking-widest text-lg">RAHASIA</span>
        </div>
        <div class="border-b-2 border-black pb-1 mb-6 inline-block text-left">
            <div class="text-xs font-semibold text-gray-800 uppercase leading-tight">
                SEKOLAH TINGGI INTELIJEN NEGARA<br>INTELIJEN TEKNOLOGI
            </div>
        </div>

        <h1 class="text-xl font-bold text-center mb-6 underline">LAPORAN INFORMASI</h1>

        <form id="reportForm" class="space-y-6">
            
            <div class="bg-gray-50 p-4 rounded-md border grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-1">Kategori (R)</label>
                    <input type="text" id="kategori" value="R" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">No. Laporan</label>
                    <input type="number" id="noLaporan" placeholder="46" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Bulan (Romawi)</label>
                    <select id="bulan" class="w-full border p-2 rounded">
                        <option value="I">I</option><option value="II">II</option>
                        <option value="III" selected>III</option><option value="IV">IV</option>
                        <option value="V">V</option><option value="VI">VI</option>
                        <option value="VII">VII</option><option value="VIII">VIII</option>
                        <option value="IX">IX</option><option value="X">X</option>
                        <option value="XI">XI</option><option value="XII">XII</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Tahun</label>
                    <input type="number" id="tahun" value="2026" class="w-full border p-2 rounded" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div>
                    <label class="block font-semibold mb-1">Kepada:</label>
                    <input type="text" value="Yth. Kepala Prodi Intelijen Teknologi" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Dari (Nama Akun):</label>
                    <input type="text" id="namaAkun" value="Monteverdi Kaleb Pinondang Simarmata" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Tembusan:</label>
                <ol class="list-decimal list-inside text-sm bg-gray-50 p-3 rounded border text-gray-700">
                    <li>Sekretaris Prodi Intelijen Teknologi</li>
                    <li>Staf Prodi Intelijen Teknologi</li>
                </ol>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Hal / Subjek</label>
                    <input type="text" id="hal" placeholder="Masukkan perihal..." class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai Informasi</label>
                    <input type="text" id="nilai" placeholder="A-1" class="w-full border p-2 rounded" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">I. FAKTA-FAKTA</label>
                <div id="editorFakta" class="h-44 bg-white"></div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">II. CATATAN</label>
                <div id="editorCatatan" class="h-36 bg-white"></div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Upload Foto Lampiran:</label>
                <input type="file" id="fotoLampiran" accept="image/*" class="w-full border p-2 rounded text-sm">
                <div id="imagePreview" class="mt-2"></div>
            </div>

            <!-- Menggunakan 2 Tombol Terpisah untuk Format Berbeda -->
            <div class="flex flex-col md:flex-row gap-4 pt-4 border-t mt-6">
                <button type="button" onclick="generateDocument('docx')" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded shadow transition">
                    Download Word (.docx)
                </button>
                <button type="button" onclick="generateDocument('pdf')" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded shadow transition">
                    Download PDF (.pdf)
                </button>
            </div>
        </form>
    </div>

    <script>
        const quillFakta = new Quill('#editorFakta', { theme: 'snow' });
        const quillCatatan = new Quill('#editorCatatan', { theme: 'snow' });

        let base64Image = "";
        document.getElementById('fotoLampiran').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    base64Image = evt.target.result;
                    document.getElementById('imagePreview').innerHTML = `<img src="${base64Image}" style="width: 5cm; height: 6cm; object-fit: cover;" class="rounded border mt-2">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Fungsi Utama untuk Generate Dokumen (Menerima parameter 'docx' atau 'pdf')
        function generateDocument(type) {
            // Validasi Input Wajib
            const noLaporan = document.getElementById('noLaporan').value;
            const hal = document.getElementById('hal').value;
            if (!noLaporan || !hal) {
                alert("Harap isi No. Laporan dan Hal / Subjek terlebih dahulu.");
                return;
            }

            const bulan = document.getElementById('bulan').value;
            const tahun = document.getElementById('tahun').value;
            const nilai = document.getElementById('nilai').value;
            const namaAkun = document.getElementById('namaAkun').value;
            const faktaHtml = quillFakta.root.innerHTML;
            const catatanHtml = quillCatatan.root.innerHTML;
            const fileName = `LI-${noLaporan}-${bulan}-${tahun}`;

            // Struktur HTML Murni (Menggunakan inline CSS ketat agar presisi di Word & PDF)
            const docBody = `
                <div style="font-family: Arial, sans-serif; font-size: 12pt; line-height: 1.3; color: black;">
                    <!-- Header RAHASIA -->
                    <div style="text-align: center; font-weight: bold; font-size: 12pt; margin-bottom: 12pt;">RAHASIA</div>

                    <!-- Kop Surat -->
                    <div style="font-size: 12pt; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #000000; display: inline-block; padding-bottom: 2px; margin-bottom: 18pt;">
                        SEKOLAH TINGGI INTELIJEN NEGARA<br>INTELIJEN TEKNOLOGI
                    </div>
                    <br><br>

                    <!-- Judul Laporan -->
                    <div style="text-align: center; font-size: 12pt; font-weight: bold; text-decoration: underline; margin-bottom: 2pt;">LAPORAN INFORMASI</div>
                    <div style="text-align: center; font-size: 12pt; margin-top: 0; margin-bottom: 15pt;">Nomor: R / LI – ${noLaporan} / ${bulan} / ${tahun}</div>
                    
                    <!-- Tabel Meta -->
                    <table style="margin-left: auto; margin-right: auto; width: 85%; border-collapse: collapse;" border="0">
                        <tr>
                            <td style="width: 18%; vertical-align: top; padding: 2px 4px; font-size: 12pt;">Kepada</td>
                            <td style="width: 3%; vertical-align: top; padding: 2px 4px; font-size: 12pt;">:</td>
                            <td style="width: 79%; vertical-align: top; padding: 2px 4px; font-size: 12pt;">Yth. Kepala Prodi Intelijen Teknologi</td>
                        </tr>
                        <tr>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">Dari</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">:</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">${namaAkun}</td>
                        </tr>
                        <tr>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">Tembusan</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">:</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">1. Sekretaris Prodi Intelijen Teknologi<br>2. Staf Prodi Intelijen Teknologi</td>
                        </tr>
                        <tr>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">Hal</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">:</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">${hal}</td>
                        </tr>
                        <tr>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">Nilai</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">:</td>
                            <td style="vertical-align: top; padding: 2px 4px; font-size: 12pt;">${nilai}</td>
                        </tr>
                    </table>
                    <br>

                    <!-- Fakta-fakta -->
                    <div style="font-size: 12pt; margin-top: 14pt; margin-bottom: 4pt;">I. FAKTA-FAKTA</div>
                    <div style="margin-bottom: 12pt;">${faktaHtml}</div>

                    <!-- Catatan -->
                    <div style="font-size: 12pt; margin-top: 14pt; margin-bottom: 4pt;">II. CATATAN</div>
                    <div style="margin-bottom: 12pt;">${catatanHtml}</div>

                    <!-- Lampiran -->
                    <div style="font-size: 12pt; margin-top: 14pt; margin-bottom: 4pt;">LAMPIRAN</div>
                    ${base64Image ? `<img src="${base64Image}" style="width: 5cm; height: 6cm; object-fit: cover;" />` : '<p>-</p>'}
                </div>
            `;

            // Percabangan Logika Ekspor
            if (type === 'docx') {
                // Ekspor ke format Word
                const htmlTemplate = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${docBody}</body></html>`;
                const converted = htmlDocx.asBlob(htmlTemplate);
                saveAs(converted, `${fileName}.docx`);
            } else if (type === 'pdf') {
                // Ekspor ke format PDF
                const pdfElement = document.createElement('div');
                pdfElement.innerHTML = docBody;
                
                // Konfigurasi Margin & Ukuran Kertas PDF (Format A4)
                const opt = {
                    margin:       1.5, // 1.5 cm margin
                    filename:     `${fileName}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'cm', format: 'a4', orientation: 'portrait' }
                };
                
                // Proses render PDF
                html2pdf().set(opt).from(pdfElement).save();
            }
        }
    </script>
</body>
</html>
